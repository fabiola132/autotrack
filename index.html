<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoTrack — Rastreador de tiempo automático para Chrome</title>
<meta name="description" content="AutoTrack rastrea automáticamente cuánto tiempo pasas en cada sitio web, sin botones de inicio/pausa, y te muestra estadísticas de productividad. 100% local y privado." />
<style>
  :root {
    --bg: #14161b;
    --bg-row: #1c2028;
    --card: #191c22;
    --ink: #eef0f3;
    --ink-dim: #8b93a1;
    --amber: #e8a33d;
    --amber-dim: #e8a33d55;
    --productive: #6fcf7f;
    --distracting: #e85d5d;
    --sans: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    --mono: "SF Mono", "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
  }
  a { color: var(--amber); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }

  .lang-switch {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid #262a33;
    border-radius: 8px;
    padding: 3px;
    z-index: 10;
  }
  .lang-switch button {
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .lang-switch button.active { background: var(--amber); color: #191c22; }

  header.hero {
    padding: 72px 0 56px;
    text-align: center;
    border-bottom: 1px solid #262a33;
  }
  .brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .brand img { width: 40px; height: 40px; border-radius: 9px; }
  .brand span {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  h1 {
    font-size: clamp(32px, 5vw, 48px);
    line-height: 1.15;
    margin: 0 0 18px;
  }
  h1 .accent { color: var(--amber); }
  .subtitle {
    color: var(--ink-dim);
    font-size: 18px;
    max-width: 560px;
    margin: 0 auto 32px;
  }
  .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .cta-btn {
    background: var(--amber);
    color: #191c22;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 9px;
    text-decoration: none;
    display: inline-block;
  }
  .ghost-btn {
    border: 1px solid #333947;
    color: var(--ink);
    font-weight: 600;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 9px;
    text-decoration: none;
    display: inline-block;
  }

  section { padding: 64px 0; border-bottom: 1px solid #262a33; }
  section:last-of-type { border-bottom: none; }
  h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin: 0 0 28px;
    text-align: center;
  }

  .features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }
  .feature {
    background: var(--card);
    border: 1px solid #262a33;
    border-radius: 12px;
    padding: 22px;
  }
  .feature h3 { margin: 0 0 8px; font-size: 15px; }
  .feature p { margin: 0; color: var(--ink-dim); font-size: 13.5px; }

  .plans {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  .plan {
    background: var(--card);
    border: 1px solid #262a33;
    border-radius: 14px;
    padding: 28px;
  }
  .plan.pro { border-color: var(--amber-dim); }
  .plan-name { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-dim); }
  .plan.pro .plan-name { color: var(--amber); }
  .plan-price { font-size: 32px; font-weight: 700; margin: 8px 0 20px; }
  .plan-price span { font-size: 14px; font-weight: 400; color: var(--ink-dim); }
  .plan ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .plan li { font-size: 14px; color: var(--ink-dim); padding-left: 20px; position: relative; }
  .plan li::before { content: "✓"; position: absolute; left: 0; color: var(--productive); }
  .plan.pro li::before { color: var(--amber); }

  .privacy { text-align: center; max-width: 640px; margin: 0 auto; }
  .privacy p { color: var(--ink-dim); font-size: 15px; }

  footer { padding: 40px 0; text-align: center; color: var(--ink-dim); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
</style>
</head>
<body>

  <div class="lang-switch">
    <button type="button" id="lang-es" data-lang="es">ES</button>

        <span>AUTOTRACK</span>
      </div>
      <h1 id="hero-title"></h1>
      <p class="subtitle" id="hero-subtitle"></p>
      <div class="cta-row">
        <a class="cta-btn" href="#planes" id="cta-plans"></a>
        <a class="ghost-btn" href="mailto:fl.fabiola2023@gmail.com" id="cta-contact"></a>
      </div>
    </div>
  </header>

  <section>
    <div class="wrap">
      <h2 id="section-features"></h2>
      <div class="features">
        <div class="feature">
          <h3 id="f1-title"></h3>
          <p id="f1-desc"></p>
        </div>
        <div class="feature">

      <p id="privacy-text"></p>
    </div>
  </section>

  <footer>AutoTrack · <a href="privacy.html" id="footer-privacy"></a></footer>

  <script>
    const STRINGS = {
      es: {
        "hero-title": 'Sabe en qué se te va el tiempo,<br /><span class="accent">sin mover un dedo.</span>',
        "hero-subtitle": "Extensión de Chrome que rastrea automáticamente cuánto tiempo pasas en cada sitio web y te muestra tu productividad real — sin botones de inicio/pausa, sin fricción.",
        "cta-plans": "Ver planes",
        "cta-contact": "Contacto",
        "section-features": "Qué hace",
        "f1-title": "Rastreo automático",
        "f1-desc": "Detecta la pestaña activa, si Chrome tiene el foco y si estás inactivo. Nunca tienes que darle start/stop.",
        "f2-title": "Cronología y Objetivos",
        "f2-desc": "Revisa tu actividad hora por hora y define metas diarias o semanales por sitio o categoría.",
        "f3-title": "Análisis de productividad",
        "f3-desc": "Categorías automáticas (trabajo, distracción, neutral), tendencias, y tus horas más productivas.",
        "f4-title": "Informe semanal",
        "f4-desc": "Un resumen de tu semana vs. la anterior, listo para copiar o descargar.",
        "f5-title": "Alertas de tiempo",
        "f5-desc": "Recibe un aviso cuando te acerques o superes el límite que definiste para un sitio o categoría.",
        "f6-title": "Español e inglés",
        "f6-desc": "Toda la interfaz disponible en ambos idiomas, con opción de cambiarlo manualmente.",
        "section-plans": "Planes",
        "plan-free-name": "Free",
        "free-f1": "Rastreo automático ilimitado",
        "free-f2": "Historial de 7 días",
        "free-f3": "Análisis básico",
        "free-f4": "2 objetivos, 2 alertas",
        "free-f5": "3 categorías personalizadas",
        "plan-pro-name": "Pro",
        "plan-pro-period": " / mes",
        "pro-f1": "Historial de 30 días",
        "pro-f2": "Objetivos, alertas y categorías ilimitadas",
        "pro-f3": "Análisis avanzado (tendencias, patrones)",
        "pro-f4": "Informe semanal + exportación",
        "pro-f5": "Exportación a CSV",
        "section-privacy": "Privacidad",
        "privacy-text": "Todos tus datos de navegación se guardan localmente en tu navegador. AutoTrack no envía el contenido de tus pestañas, contraseñas ni pulsaciones de teclado a ningún servidor. Solo se registra el dominio visitado, el tiempo y la categoría de productividad — lo necesario para tus estadísticas.",
        "footer-privacy": "Política de privacidad",
      },
      en: {
        "hero-title": 'Know where your time really goes,<br /><span class="accent">without lifting a finger.</span>',
        "hero-subtitle": "A Chrome extension that automatically tracks how much time you spend on each website and shows your real productivity — no start/stop buttons, no friction.",
        "cta-plans": "See plans",
        "cta-contact": "Contact",
        "section-features": "What it does",
        "f1-title": "Automatic tracking",
        "f1-desc": "Detects the active tab, whether Chrome is focused, and whether you're idle. You never have to hit start/stop.",
        "f2-title": "Timeline & Goals",
        "f2-desc": "Review your activity hour by hour and set daily or weekly goals per site or category.",
        "f3-title": "Productivity insights",
        "f3-desc": "Automatic categories (work, distracting, neutral), trends, and your most productive hours.",
        "f4-title": "Weekly report",
        "f4-desc": "A summary of your week vs. the previous one, ready to copy or download.",
        "f5-title": "Time alerts",
        "f5-desc": "Get notified when you're close to or over the limit you set for a site or category.",
        "f6-title": "Spanish & English",
        "f6-desc": "The whole interface is available in both languages, switchable anytime.",
        "section-plans": "Plans",
        "plan-free-name": "Free",
        "free-f1": "Unlimited automatic tracking",
        "free-f2": "7-day history",
        "free-f3": "Basic insights",
        "free-f4": "2 goals, 2 alerts",
        "free-f5": "3 custom categories",
        "plan-pro-name": "Pro",
        "plan-pro-period": " / month",
        "pro-f1": "30-day history",
        "pro-f2": "Unlimited goals, alerts and categories",
        "pro-f3": "Advanced insights (trends, patterns)",
        "pro-f4": "Weekly report + export",
        "pro-f5": "CSV export",
        "section-privacy": "Privacy",
        "privacy-text": "All your browsing data is stored locally in your browser. AutoTrack never sends tab contents, passwords, or keystrokes to any server. Only the visited domain, time spent, and productivity category are recorded — what's needed for your stats.",
        "footer-privacy": "Privacy Policy",
      },
    };
    const HTML_KEYS = new Set(["hero-title"]);

    function applyLang(lang) {
      const dict = STRINGS[lang];
      for (const [id, value] of Object.entries(dict)) {
        const el = document.getElementById(id);
        if (!el) continue;
        if (HTML_KEYS.has(id)) el.innerHTML = value;
        else el.textContent = value;
      }
      document.documentElement.lang = lang;
      document.getElementById("lang-es").classList.toggle("active", lang === "es");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      localStorage.setItem("autotrack-landing-lang", lang);
    }

    document.getElementById("lang-es").addEventListener("click", () => applyLang("es"));
    document.getElementById("lang-en").addEventListener("click", () => applyLang("en"));

    function detectLang() {
      const saved = localStorage.getItem("autotrack-landing-lang");
      if (saved === "es" || saved === "en") return saved;
      return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
    }
    applyLang(detectLang());
  </script>

</html>
