<title>AutoTrack — Privacy Policy / Política de Privacidad</title>
<meta name="description" content="AutoTrack privacy policy: what data is collected, where it's stored, and which third-party services are used." />
<style>
  :root {
    --bg: #14161b;
    --card: #191c22;
    --ink: #eef0f3;
    --ink-dim: #8b93a1;
    --amber: #e8a33d;
    --amber-dim: #e8a33d55;
    --sans: -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    --mono: "SF Mono", "Roboto Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
  }
  a { color: var(--amber); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 64px 24px 80px; }

  .lang-switch {
    position: fixed;
    top: 16px;
    right: 16px;
    display: flex;
    gap: 4px;
    background: var(--card);
    border: 1px solid #262a33;
    border-radius: 8px;
    padding: 3px;
    z-index: 10;
  }
  .lang-switch button {
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .lang-switch button.active { background: var(--amber); color: #191c22; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  .brand span { font-weight: 700; letter-spacing: 0.02em; }

  h1 { font-size: 28px; margin: 24px 0 4px; }
  .updated { color: var(--ink-dim); font-size: 13px; margin: 0 0 40px; }

  h2 {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--amber);
    margin: 36px 0 12px;
  }
  p, li { color: var(--ink-dim); font-size: 15px; }
  ul { padding-left: 20px; }
  li { margin-bottom: 6px; }
  strong { color: var(--ink); }
  .back { display: inline-block; margin-bottom: 24px; font-size: 13px; }
</style>
</head>

      },
    };

    function applyLang(lang) {
      const dict = STRINGS[lang];
      for (const [id, value] of Object.entries(dict)) {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      }
      document.documentElement.lang = lang;
      document.getElementById("lang-es").classList.toggle("active", lang === "es");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      localStorage.setItem("autotrack-landing-lang", lang);
    }

    document.getElementById("lang-es").addEventListener("click", () => applyLang("es"));
    document.getElementById("lang-en").addEventListener("click", () => applyLang("en"));

    function detectLang() {
      const saved = localStorage.getItem("autotrack-landing-lang");
      if (saved === "es" || saved === "en") return saved;
      return (navigator.language || "es").toLowerCase().startsWith("en") ? "en" : "es";
    }
    applyLang(detectLang());
  </script>
